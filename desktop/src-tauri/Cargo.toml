[package]
name = "open-agent-seal-desktop"
version = "0.1.0"
description = "OpenAgentSeal lightweight desktop shell"
authors = ["OpenAgentSeal"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.5.0", features = [] }

[dependencies]
tauri = { version = "=2.8.0", features = ["tray-icon", "image-ico"] }
tauri-runtime = "=2.8.0"
tauri-runtime-wry = "=2.8.0"
tauri-utils = "=2.8.0"

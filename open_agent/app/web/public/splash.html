<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAgentSeal</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
      }

      .splash {
        position: relative;
        display: flex;
        width: 100%;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid rgba(131, 162, 198, 0.34);
        border-radius: 18px;
        background:
          radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.98), rgba(238, 247, 255, 0.94) 58%, rgba(226, 240, 252, 0.96)),
          #eef7ff;
        box-shadow: 0 18px 52px rgba(45, 83, 126, 0.2);
      }

      .brand {
        margin: 0;
        color: #172438;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .track {
        position: relative;
        width: 330px;
        height: 112px;
        margin-top: 14px;
        overflow: hidden;
      }

      .seal-runner {
        position: absolute;
        top: 4px;
        left: 0;
        width: 144px;
        height: 96px;
        animation: crawl 3.6s ease-in-out infinite alternate;
      }

      .seal {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 8px 6px rgba(80, 118, 151, 0.2));
        animation: scoot 0.72s ease-in-out infinite alternate;
      }

      .ice-line {
        position: absolute;
        right: 8px;
        bottom: 13px;
        left: 8px;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(109, 164, 206, 0.38) 14%, rgba(109, 164, 206, 0.38) 86%, transparent);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 5px 0 0;
        color: #66809b;
        font-size: 13px;
      }

      .dots {
        display: flex;
        gap: 4px;
      }

      .dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #4e8ee8;
        animation: pulse 1.2s ease-in-out infinite;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.16s;
      }

      .dots span:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes crawl {
        0% {
          transform: translateX(0);
        }

        100% {
          transform: translateX(186px);
        }
      }

      @keyframes scoot {
        0% {
          transform: translateY(2px) rotate(1.5deg) scaleX(-1);
        }

        100% {
          transform: translateY(-3px) rotate(-1.5deg) scaleX(-0.985);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }

        50% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <h1 class="brand">OpenAgentSeal</h1>
      <div class="track" aria-hidden="true">
        <div class="seal-runner">
          <img class="seal" src="./assets/seal-crawl.png" alt="" />
        </div>
        <div class="ice-line"></div>
      </div>
      <p class="status">
        正在唤醒智能体
        <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
      </p>
    </main>
  </body>
</html>
